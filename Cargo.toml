# Post-quantum key exchange: ML-KEM-768 (FIPS 203), X25519 (RFC 7748), and
# the X25519MLKEM768 hybrid used in TLS 1.3. SHA-3 and SHAKE (FIPS 202) are
# built in. Not used by anvil-browser yet; see the README.

[package]
name = "anvil-pqc"
version = "0.1.0"
edition = "2024"
authors = ["Buntato <324143321+buntatoes@users.noreply.github.com>"]
license = "MPL-2.0"
description = "ML-KEM-768, X25519, and the X25519MLKEM768 hybrid, with SHA-3 built in."
repository = "https://github.com/buntatoes/anvil-pqc"
homepage = "https://github.com/buntatoes/anvil-pqc"
readme = "README.md"
keywords = ["ml-kem", "kyber", "x25519", "post-quantum", "sha3"]
categories = ["cryptography"]
publish = false

[lints.rust]
unsafe_code = "forbid"
